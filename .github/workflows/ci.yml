name: CI

# Runs on every push and PR against main — until this repo has one of
# these, nothing gates a broken build/test/typecheck from landing.
# Pinned to Node 24 to match what this project has actually been
# developed and verified against this round (confirmed via `node --version`
# during the Next.js 16 upgrade), not an arbitrary/untested version.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets anyone re-run the docker job on demand from the Actions tab without
  # needing a new commit — useful for validating a Dockerfile change (or
  # just re-checking it still builds) when Docker isn't available locally.
  # Also what triggers the `preview` job below (see its own comment).
  workflow_dispatch:
    inputs:
      preview_minutes:
        description: "Minutes to keep the live preview tunnel open (preview job only)"
        required: false
        default: "10"

# CI-only values — not real secrets. The app talks to a throwaway SQLite
# file created fresh in this job (never a real database), and SMTP is left
# unset so email sending no-ops to a console log instead of trying to send
# anywhere real. See README.md's "Environment variables" table for what
# each of these does in a real deployment.
env:
  DATABASE_URL: "file:./dev.db"
  NEXTAUTH_SECRET: "ci-only-not-a-real-secret"
  NEXTAUTH_URL: "http://localhost:3000"
  APP_BASE_URL: "http://localhost:3000"

jobs:
  test:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # `npm ci` (the normally-preferred, stricter, exact-lockfile-match
      # install) fails on this repo specifically: @sentry/nextjs depends on
      # @sentry/webpack-plugin, which peer-depends on webpack — a peer this
      # app never actually needs at runtime (Next 16 builds via Turbopack
      # by default, not webpack), so it's legitimately left unmet. That
      # same unmet-peer situation is also why next-auth (which peer-depends
      # on an older nodemailer range than this app's own nodemailer
      # dependency) needed --legacy-peer-deps earlier in this project's
      # history. --legacy-peer-deps quiets peer validation during
      # resolution, which is also what makes `npm ci`'s stricter lockfile-
      # completeness check flag the same peers as "missing from lock
      # file" even right after a clean install — confirmed directly: a
      # from-scratch `rm -rf node_modules package-lock.json && npm install`
      # still fails a subsequent `npm ci` with the identical error. Given
      # `npm ci` cannot actually succeed against this dependency graph as
      # it stands, `npm install` here is the honest choice, not a
      # weakening of an otherwise-working check.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to a fresh throwaway SQLite DB
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      # npm test manages its own separate prisma/test.db via
      # tests/globalSetup.ts (migrated fresh on every run) — no extra setup
      # needed here beyond the migration above, which only touches dev.db.
      - name: Run tests
        run: npm test

      # Needs a migrated dev.db to exist: the home page (src/app/page.tsx)
      # is statically prerendered at build time and queries the Project
      # table directly — confirmed by `npm run build`'s own route output
      # marking / as ○ (Static) earlier in this project's history.
      - name: Production build
        run: npm run build

  # Separate job so a new vulnerability shows as its own failing check
  # rather than being buried inside the main build's log. Currently at a
  # clean 0 vulnerabilities baseline (confirmed) — the whole point of this
  # job is to catch the *next* one automatically instead of relying on
  # someone remembering to run `npm audit` by hand, which is how the 6
  # vulnerabilities (3 critical, 3 high) already found and fixed in this
  # project were originally caught. Paired with .github/dependabot.yml,
  # which opens the PR to actually fix what this job flags.
  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # `npm ci` (the normally-preferred, stricter, exact-lockfile-match
      # install) fails on this repo specifically: @sentry/nextjs depends on
      # @sentry/webpack-plugin, which peer-depends on webpack — a peer this
      # app never actually needs at runtime (Next 16 builds via Turbopack
      # by default, not webpack), so it's legitimately left unmet. That
      # same unmet-peer situation is also why next-auth (which peer-depends
      # on an older nodemailer range than this app's own nodemailer
      # dependency) needed --legacy-peer-deps earlier in this project's
      # history. --legacy-peer-deps quiets peer validation during
      # resolution, which is also what makes `npm ci`'s stricter lockfile-
      # completeness check flag the same peers as "missing from lock
      # file" even right after a clean install — confirmed directly: a
      # from-scratch `rm -rf node_modules package-lock.json && npm install`
      # still fails a subsequent `npm ci` with the identical error. Given
      # `npm ci` cannot actually succeed against this dependency graph as
      # it stands, `npm install` here is the honest choice, not a
      # weakening of an otherwise-working check.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: npm audit (high + critical)
        run: npm audit --audit-level=high

  # Builds the actual production image from the Dockerfile and boots a real
  # container from it — not just a syntax check. GitHub's ubuntu-latest
  # runners ship Docker pre-installed, so this is how this Dockerfile gets
  # validated end-to-end (real `docker build`, real container, real HTTP
  # request against a running instance) without Docker available on the
  # developer's own machine, which is the actual situation this project was
  # built under: WSL2 is blocked by laptop policy, so `docker build` has
  # never been run locally — this job is the first real signal on whether
  # the Dockerfile and docker-entrypoint.sh actually work.
  docker:
    name: Build and smoke-test the Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t raqaba-helpdesk:ci .

      # Runs against a throwaway SQLite file inside the container itself
      # (not a mounted volume) — this job only needs to prove the image
      # boots, migrates, and serves traffic, not that data persists.
      - name: Run container
        run: |
          docker run -d --name raqaba-ci -p 3000:3000 \
            -e DATABASE_URL="file:./ci.db" \
            -e NEXTAUTH_SECRET="ci-only-not-a-real-secret" \
            -e NEXTAUTH_URL="http://localhost:3000" \
            -e APP_BASE_URL="http://localhost:3000" \
            raqaba-helpdesk:ci

      # Polls instead of a fixed sleep — migrations + server boot time can
      # vary between runs, and a flat sleep would either waste time or
      # (worse) flake under load. 60s cap: comfortably above what a cold
      # migrate-deploy + Next.js standalone server boot should ever take.
      - name: Wait for the container to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then
              echo "Healthy after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy within 60s"
          exit 1

      - name: Container logs (always shown — confirms migrations ran and the scheduler started even on success, and is the first thing to check on failure)
        if: always()
        run: docker logs raqaba-ci

      - name: Clean up
        if: always()
        run: docker rm -f raqaba-ci || true

  # Manual-trigger-only: builds the real image, runs it, seeds it with the
  # real raqaba project (no demo data — see prisma/seed-essentials.ts), and
  # opens a temporary public URL via Cloudflare's free "quick tunnel" (no
  # account needed) so it can actually be clicked through in a browser —
  # for whoever's developing this without Docker available locally (WSL2
  # blocked by laptop policy at the time this was added). The tunnel URL is
  # unlisted but not private: anyone who has it can reach the instance for
  # as long as this job keeps it open. Everything is torn down when the job
  # ends, whether that's the requested duration or a failure partway
  # through (the `if: always()` cleanup step).
  preview:
    name: Temporary live preview (manual trigger only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Safety cap independent of preview_minutes — build + healthcheck +
    # seed overhead is ~3-4 minutes, so this comfortably covers a
    # reasonable preview_minutes value while guaranteeing the job can't run
    # away indefinitely (e.g. a typo'd non-numeric input breaking the sleep
    # arithmetic into something unexpected).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Host-side (outside the container) install — needed to run the seed
      # script against the container's database file via the bind mount
      # below, since prisma:seed:essentials needs `tsx`, a devDependency
      # never shipped in the production image itself.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build image
        run: docker build -t raqaba-helpdesk:preview .

      # cloudflared's "quick tunnel" needs no account/auth token — it prints
      # a random https://*.trycloudflare.com URL that proxies to whatever's
      # listening on the given local port. Captured from its own log output
      # since it doesn't expose the URL any other way for this mode.
      - name: Start Cloudflare quick tunnel
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://localhost:3000 > cloudflared.log 2>&1 &
          echo "Waiting for tunnel URL..."
          url=""
          for i in $(seq 1 30); do
            url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflared.log | head -1 || true)
            if [ -n "$url" ]; then break; fi
            sleep 2
          done
          if [ -z "$url" ]; then
            echo "Failed to get a tunnel URL within 60s"
            cat cloudflared.log
            exit 1
          fi
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "Tunnel URL: $url"

      # NEXTAUTH_URL/APP_BASE_URL are set to the tunnel URL itself (only
      # known after the step above), not localhost — NextAuth's callback
      # handling and this app's absolute links (emails, redirects) need to
      # match the URL a real visitor is actually using. Database file is
      # bind-mounted so the host can seed it directly afterward, same
      # pattern as the local isolated-testing instructions in README.md.
      - name: Run container
        run: |
          mkdir -p preview-data
          docker run -d --name raqaba-preview -p 3000:3000 \
            -v "$PWD/preview-data:/app/prisma-data" \
            -e DATABASE_URL="file:/app/prisma-data/preview.db" \
            -e NEXTAUTH_SECRET="$(openssl rand -base64 32)" \
            -e NEXTAUTH_URL="$PREVIEW_URL" \
            -e APP_BASE_URL="$PREVIEW_URL" \
            raqaba-helpdesk:preview

      - name: Wait for the container to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then
              echo "Healthy after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy within 60s"
          docker logs raqaba-preview
          exit 1

      - name: Seed the real project (no demo data)
        run: DATABASE_URL="file:$PWD/preview-data/preview.db" npm run prisma:seed:essentials

      - name: Preview is live
        run: |
          echo "::notice title=Live preview ready::$PREVIEW_URL — login as admin@raqaba.local / ChangeMe123!"
          echo "Open $PREVIEW_URL now — staying up for ${{ github.event.inputs.preview_minutes }} minute(s)."
          sleep $(( ${{ github.event.inputs.preview_minutes }} * 60 ))

      - name: Clean up
        if: always()
        run: |
          docker rm -f raqaba-preview || true
          pkill cloudflared || true
