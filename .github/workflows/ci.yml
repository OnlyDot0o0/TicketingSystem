name: CI

# Runs on every push and PR against main — until this repo has one of
# these, nothing gates a broken build/test/typecheck from landing.
# Pinned to Node 24 to match what this project has actually been
# developed and verified against this round (confirmed via `node --version`
# during the Next.js 16 upgrade), not an arbitrary/untested version.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI-only values — not real secrets. The app talks to a throwaway SQLite
# file created fresh in this job (never a real database), and SMTP is left
# unset so email sending no-ops to a console log instead of trying to send
# anywhere real. See README.md's "Environment variables" table for what
# each of these does in a real deployment.
env:
  DATABASE_URL: "file:./dev.db"
  NEXTAUTH_SECRET: "ci-only-not-a-real-secret"
  NEXTAUTH_URL: "http://localhost:3000"
  APP_BASE_URL: "http://localhost:3000"

jobs:
  test:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # `npm ci` (the normally-preferred, stricter, exact-lockfile-match
      # install) fails on this repo specifically: @sentry/nextjs depends on
      # @sentry/webpack-plugin, which peer-depends on webpack — a peer this
      # app never actually needs at runtime (Next 16 builds via Turbopack
      # by default, not webpack), so it's legitimately left unmet. That
      # same unmet-peer situation is also why next-auth (which peer-depends
      # on an older nodemailer range than this app's own nodemailer
      # dependency) needed --legacy-peer-deps earlier in this project's
      # history. --legacy-peer-deps quiets peer validation during
      # resolution, which is also what makes `npm ci`'s stricter lockfile-
      # completeness check flag the same peers as "missing from lock
      # file" even right after a clean install — confirmed directly: a
      # from-scratch `rm -rf node_modules package-lock.json && npm install`
      # still fails a subsequent `npm ci` with the identical error. Given
      # `npm ci` cannot actually succeed against this dependency graph as
      # it stands, `npm install` here is the honest choice, not a
      # weakening of an otherwise-working check.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to a fresh throwaway SQLite DB
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      # npm test manages its own separate prisma/test.db via
      # tests/globalSetup.ts (migrated fresh on every run) — no extra setup
      # needed here beyond the migration above, which only touches dev.db.
      - name: Run tests
        run: npm test

      # Needs a migrated dev.db to exist: the home page (src/app/page.tsx)
      # is statically prerendered at build time and queries the Project
      # table directly — confirmed by `npm run build`'s own route output
      # marking / as ○ (Static) earlier in this project's history.
      - name: Production build
        run: npm run build

  # Separate job so a new vulnerability shows as its own failing check
  # rather than being buried inside the main build's log. Currently at a
  # clean 0 vulnerabilities baseline (confirmed) — the whole point of this
  # job is to catch the *next* one automatically instead of relying on
  # someone remembering to run `npm audit` by hand, which is how the 6
  # vulnerabilities (3 critical, 3 high) already found and fixed in this
  # project were originally caught. Paired with .github/dependabot.yml,
  # which opens the PR to actually fix what this job flags.
  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # `npm ci` (the normally-preferred, stricter, exact-lockfile-match
      # install) fails on this repo specifically: @sentry/nextjs depends on
      # @sentry/webpack-plugin, which peer-depends on webpack — a peer this
      # app never actually needs at runtime (Next 16 builds via Turbopack
      # by default, not webpack), so it's legitimately left unmet. That
      # same unmet-peer situation is also why next-auth (which peer-depends
      # on an older nodemailer range than this app's own nodemailer
      # dependency) needed --legacy-peer-deps earlier in this project's
      # history. --legacy-peer-deps quiets peer validation during
      # resolution, which is also what makes `npm ci`'s stricter lockfile-
      # completeness check flag the same peers as "missing from lock
      # file" even right after a clean install — confirmed directly: a
      # from-scratch `rm -rf node_modules package-lock.json && npm install`
      # still fails a subsequent `npm ci` with the identical error. Given
      # `npm ci` cannot actually succeed against this dependency graph as
      # it stands, `npm install` here is the honest choice, not a
      # weakening of an otherwise-working check.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: npm audit (high + critical)
        run: npm audit --audit-level=high
